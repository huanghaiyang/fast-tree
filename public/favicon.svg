<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FastTree">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2230"/>
      <stop offset="1" stop-color="#123b3b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="62%">
      <stop offset="0" stop-color="#34d399" stop-opacity=".55"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trunk" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f4c77d"/>
      <stop offset="1" stop-color="#b46b2c"/>
    </linearGradient>
    <linearGradient id="leafA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bef264"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="leafB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="14" fill="none" stroke="#ffffff" stroke-opacity=".09"/>
  <circle cx="32" cy="25" r="23" fill="url(#glow)"/>
  <ellipse cx="32" cy="55" rx="14" ry="2.6" fill="#020617" opacity=".28"/>

  <!-- trunk + branches -->
  <path d="M29.6 54 C30.6 46 31.3 39 31.6 32.5 L32.4 32.5 C32.7 39 33.4 46 34.4 54 Z" fill="url(#trunk)"/>
  <g fill="none" stroke="url(#trunk)" stroke-linecap="round">
    <path d="M32 45 C27 42.5 23.5 39 21 34.5" stroke-width="2.4"/>
    <path d="M32 41 C37 38.5 40.5 35 43 30.5" stroke-width="2.3"/>
    <path d="M32 36 C28.5 32.5 27 29 26 25.5" stroke-width="2.1"/>
    <path d="M32 34 C35.5 30.5 37 27 38 23.5" stroke-width="2"/>
    <path d="M32 31 L32 24" stroke-width="2.4"/>
  </g>

  <!-- stylized canopy -->
  <g>
    <circle cx="22.5" cy="27" r="8" fill="url(#leafB)"/>
    <circle cx="42" cy="25.5" r="7.6" fill="url(#leafA)"/>
    <circle cx="32" cy="16" r="9.2" fill="url(#leafA)"/>
    <circle cx="26" cy="18.5" r="6.4" fill="url(#leafB)"/>
    <circle cx="38.5" cy="17.5" r="6.2" fill="url(#leafB)"/>
  </g>
  <circle cx="28" cy="13.5" r="3.2" fill="#ecfdf5" opacity=".35"/>
</svg>
