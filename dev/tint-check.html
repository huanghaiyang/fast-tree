<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><title>tint-check: booting</title></head>
  <body style="margin:0;background:#111;color:#ddd;font:12px monospace">
    <iframe id="f" src="/" style="width:1200px;height:760px;border:0"></iframe>
    <pre id="out">…</pre>
    <script type="module">
      const f = document.getElementById('f')
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms))
      const L = []
      const bar = (s) => { L.push(s); document.getElementById('out').textContent = L.join('\n') }
      let win, doc, state, sc
      const errs = []
      f.addEventListener('load', () => {
        win = f.contentWindow; doc = f.contentDocument
        win.addEventListener('error', (e) => errs.push('ERR:' + e.message))
      })
      const setPose = () => {
        sc.controls.target.set(0, state.stats.height * 0.55, 0)
        sc.camera.position.set(10, state.stats.height * 0.72, 13)
        sc.camera.lookAt(sc.controls.target)
        sc.controls.update()
      }
      // 用 toDataURL -> Image -> 2D canvas 读平均色 (比直接 drawImage WebGL canvas 可靠)
      async function meanColor() {
        sc.renderer.render(sc.scene, sc.camera)
        const cv = doc.querySelector('canvas')
        const url = cv.toDataURL('image/png')
        const img = await new Promise((res) => {
          const i = new win.Image()
          i.onload = () => res(i)
          i.onerror = () => res(null)
          i.src = url
        })
        if (!img) return null
        const c2 = doc.createElement('canvas')
        c2.width = 200; c2.height = 130
        const cx = c2.getContext('2d')
        cx.drawImage(img, 0, 0, 200, 130)
        const d = cx.getImageData(0, 0, 200, 130).data
        let r = 0, g = 0, b = 0, n = 0
        for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; n++ }
        return [r / n, g / n, b / n].map((v) => +v.toFixed(1))
      }
      const dist = (a, b) => (a && b ? Math.sqrt((a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2 + (a[2] - b[2]) ** 2) : -1)
      setTimeout(async () => {
        try {
          for (let i = 0; i < 60 && !(sc && state && sc.barkMesh); i++) await sleep(150)
          sc = win.__fastTreeScene; state = win.__fastTree
          win.__fastTreeSceneApi.rebuildNow(true)
          await sleep(400)
          // 0) 先用"无贴图程序化叶形"量一次 (默认参数, 不应是白叶子)
          state.params.leafMat.texture = ''
          state.params.leaves.cardMode = false
          state.params.leafMat.tintMode = 'season'
          win.__fastTreeSceneApi.rebuildNow(true)
          await sleep(400)
          setPose(); await sleep(200)
          const plain = await meanColor()
          const bright = plain ? (plain[0] + plain[1] + plain[2]) / 3 : 0
          const greenish = plain ? plain[1] > plain[0] + 4 : false
          bar('无贴图程序化叶形: 平均色=' + JSON.stringify(plain) + ' 亮度=' + bright.toFixed(1) + ' 偏绿=' + greenish)
          bar('无贴图叶片不是白色=' + (bright < 120 && greenish))
          // 1) 应用一张卡片 + 原色模式
          const mod = await import('/src/core/leafCards.generated.js')
          win.__fastTreeApi.applyLeafCard(mod.LEAF_CARDS[0].id)
          state.params.leaves.cardMode = true
          state.params.leafMat.tintMode = 'texture'
          win.__fastTreeSceneApi.rebuildNow(true)
          await sleep(400)
          setPose(); await sleep(200)
          const summer = await meanColor()
          const leafCount0 = state.stats.leaves
          // 2) 只改"叶色"参数 (不改季节 -> 叶片密度/几何顶点数不变, 只变烘焙的顶点色)
          const recolor = () => {
            state.params.leaves.color = '#b8501c'
            state.params.leaves.colorTip = '#e8b23e'
          }
          recolor()
          win.__fastTreeSceneApi.rebuildNow(false)
          await sleep(400)
          bar('只改叶色后 叶片数=' + state.stats.leaves + ' (原 ' + leafCount0 + ', 应相同) tintMode=' + state.params.leafMat.tintMode)
          setPose(); await sleep(200)
          const autumnTex = await meanColor()
          // 3) 同样的叶色, 但切到"跟随季节" (应该明显变色)
          state.params.leafMat.tintMode = 'season'
          win.__fastTreeSceneApi.rebuildNow(false)
          await sleep(400)
          setPose(); await sleep(200)
          const autumnSeason = await meanColor()
          bar('夏季(原色)=' + JSON.stringify(summer))
          bar('秋季(原色)=' + JSON.stringify(autumnTex) + '  差异=' + dist(summer, autumnTex).toFixed(2))
          bar('秋季(跟随季节)=' + JSON.stringify(autumnSeason) + '  差异 vs 原色=' + dist(autumnTex, autumnSeason).toFixed(2))
          bar('结论: 原色模式季节无关=' + (dist(summer, autumnTex) < 6) + ' / 跟随季节确实变色=' + (dist(autumnTex, autumnSeason) > 6))
          // ===== 跟随贴图同步 + 落叶输出变换 =====
          state.params.leafMat.texture = ''
          state.params.leaves.cardMode = true
          state.params.fall = { ...state.params.fall, enabled: true, cardId: '', count: 120, size: 0.6 }
          state.params.litter = { ...state.params.litter, enabled: true, cardId: '', count: 300 }
          win.__fastTreeApi.applyLeafCard(mod.LEAF_CARDS[0].id)
          win.__fastTreeSceneApi.rebuildNow(false)
          await sleep(400)
          sc.updateFall(state.params); sc.updateLitter(state.params)
          await sleep(300)
          const mapA = sc.fallMesh && sc.fallMesh.material.uniforms.uMap.value
          const lmapA = sc.materials.leaf.map
          const litterA = sc.litterMesh && sc.litterMesh.material.map
          // 换另一张卡片 (落叶/堆积都是"跟随树叶")
          const cardB = mod.LEAF_CARDS.find((c) => c.batch !== mod.LEAF_CARDS[0].batch) || mod.LEAF_CARDS[5]
          win.__fastTreeApi.applyLeafCard(cardB.id)
          win.__fastTreeSceneApi.rebuildNow(false)
          await sleep(400)
          sc.updateFall(state.params); sc.updateLitter(state.params)
          await sleep(400)
          const mapB = sc.fallMesh && sc.fallMesh.material.uniforms.uMap.value
          const lmapB = sc.materials.leaf.map
          const litterB = sc.litterMesh && sc.litterMesh.material.map
          bar('换贴图前: 落叶map=树叶map ' + (mapA === lmapA) + ' / 堆积map=树叶map ' + (litterA === lmapA))
          bar('换贴图后: 落叶map 已更新=' + (mapB !== mapA) + ' 且=新树叶map ' + (mapB === lmapB) + ' / 堆积已更新=' + (litterB !== litterA) + ' 且=新贴图 ' + (litterB === lmapB))
          bar('落叶卡贴图尺寸=' + (mapB && mapB.image ? mapB.image.width + 'x' + mapB.image.height : '?'))
          let bad4 = 0
          for (const p of (sc.renderer.info.programs || [])) if (p.diagnostics && (p.diagnostics.vertexShader || p.diagnostics.fragmentShader || p.diagnostics.programLog)) { bad4++; bar('✗ 编译失败: ' + String(p.diagnostics.programLog || '').replace(/\n/g, ' ').slice(0, 200)) }
          bar('含落叶/堆积的 program 编译失败=' + bad4)
          // 拍一张落叶特写
          state.params.leaves.enabled = true
          setPose(); await sleep(200)
          for (let i = 0; i < 8; i++) { sc.renderer.render(sc.scene, sc.camera); await sleep(120) }
          const cv2 = doc.querySelector('canvas')
          await fetch('http://127.0.0.1:5274/shot?name=fall-color', { method: 'POST', body: cv2.toDataURL('image/png') })
          bar('shot fall-color')
          // ===== 自动法线贴图 =====
          state.params.leafMat.texture = ''
          state.params.leaves.cardMode = true
          state.params.fall.enabled = false
          state.params.litter.enabled = false
          win.__fastTreeApi.applyLeafCard(mod.LEAF_CARDS[0].id)
          state.params.leafMat.normalFromAlbedo = 1.2
          win.__fastTreeSceneApi.rebuildNow(true)
          await sleep(900)
          sc.updateMaterialParams(state.params)
          await sleep(600)
          const nm = sc.materials.leaf.normalMap
          bar('自动法线: 开启=' + state.params.leafMat.normalFromAlbedo + ' 材质有法线图=' + !!nm +
              ' 尺寸=' + (nm && nm.image ? nm.image.width + 'x' + nm.image.height : '-') +
              ' 是DataTexture=' + (nm ? !!nm.isDataTexture : false))
          bar('法线强度 normalScale=' + JSON.stringify(sc.materials.leaf.normalScale.toArray().map((v) => +v.toFixed(2))))
          // 与显式法线互斥: 关掉自动后应移除
          state.params.leafMat.normalFromAlbedo = 0
          sc.updateMaterialParams(state.params)
          await sleep(400)
          bar('关掉自动法线后 材质还有法线图=' + !!sc.materials.leaf.normalMap)
          bar('errs=' + (errs.length ? errs.slice(0, 3).join(' ;; ') : 'none'))
          document.title = 'TINTCHECK-OK :: ' + L.join(' || ').slice(0, 1500)
        } catch (e) {
          document.title = 'TINTCHECK-EX :: ' + (e && e.stack ? e.stack : e).toString().slice(0, 500)
        }
      }, 4000)
    </script>
  </body>
</html>
