<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><title>count: booting</title></head>
<body style="margin:0;background:#111;color:#ddd;font:12px monospace">
<iframe id="f" src="/" style="width:1100px;height:700px;border:0"></iframe>
<pre id="out">…</pre>
<script type="module">
const f = document.getElementById('f'); const sleep = (ms) => new Promise((r) => setTimeout(r, ms))
const L = []; const bar = (s) => { L.push(s); document.getElementById('out').textContent = L.join('\n') }
let doc
f.addEventListener('load', () => { doc = f.contentDocument })
setTimeout(async () => {
  try {
    const tabMat = [...doc.querySelectorAll('.tab')].find((t) => t.textContent.includes('材质'))
    tabMat.click(); await sleep(6000)   // 等整批探测跑完
    const chips = [...doc.querySelectorAll('.chip')].map((c) => c.textContent.trim()).filter((t) => /秋色系|绿色系|桦树|灰褐|红褐|黑白|白桦/.test(t))
    bar('批次按钮(真实张数)=' + JSON.stringify(chips))
    bar('errs=none')
    document.title = 'COUNT-OK :: ' + L.join(' || ').slice(0, 900)
  } catch (e) { document.title = 'COUNT-EX :: ' + (e && e.stack ? e.stack : e).toString().slice(0, 300) }
}, 3000)
</script></body></html>
