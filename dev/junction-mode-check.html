<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><title>junction-mode: booting</title></head>
<body style="margin:0;background:#111;color:#ddd;font:12px monospace">
<iframe id="f" src="/" style="width:1200px;height:840px;border:0"></iframe>
<pre id="out">…</pre>
<script type="module">
const f = document.getElementById('f')
const sleep = (ms) => new Promise((r) => setTimeout(r, ms))
const R = []
let fail = 0
const line = (s) => { R.push(s); document.getElementById('out').textContent = R.join('\n') }
const check = (name, cond, detail = '') => {
  if (!cond) fail++
  line((cond ? '✔ ' : '✘ ') + name + (detail ? ' — ' + detail : ''))
}
async function waitFor(fn, timeout = 30000) {
  const t0 = Date.now()
  while (Date.now() - t0 < timeout) {
    try { if (fn()) return true } catch { /* ignore */ }
    await sleep(100)
  }
  return false
}
function parseGLB(buf) {
  const dv = new DataView(buf)
  if (dv.getUint32(0, true) !== 0x46546c67) throw new Error('不是 GLB')
  let off = 12
  while (off < buf.byteLength) {
    const len = dv.getUint32(off, true)
    const type = dv.getUint32(off + 4, true)
    const data = new Uint8Array(buf, off + 8, len)
    if (type === 0x4e4f534a) return JSON.parse(new TextDecoder().decode(data))
    off += 8 + len
  }
  throw new Error('缺少 JSON chunk')
}
function boundaryEdges(geo) {
  const idx = geo.index
  if (!idx) return -1
  const m = new Map()
  const key = (a, b) => (a < b ? a + ':' + b : b + ':' + a)
  for (let i = 0; i < idx.count; i += 3) {
    const t = [idx.getX(i), idx.getX(i + 1), idx.getX(i + 2)]
    for (let e = 0; e < 3; e++) {
      const k = key(t[e], t[(e + 1) % 3])
      m.set(k, (m.get(k) || 0) + 1)
    }
  }
  let b = 0
  for (const c of m.values()) if (c === 1) b++
  return b
}
const geomHash = (geo) => {
  const a = geo && geo.attributes && geo.attributes.position && geo.attributes.position.array
  if (!a) return ''
  let h = 0
  for (let i = 0; i < a.length; i += 11) h = (h * 31 + Math.round(a[i] * 1e5)) | 0
  return String(h)
}
const rowSelect = (text) => {
  const label = [...doc.querySelectorAll('label')].find((l) => (l.textContent || '').includes(text))
  return label ? label.parentElement.querySelector('select') : null
}
let win, doc
f.addEventListener('load', () => { win = f.contentWindow; doc = f.contentDocument })
setTimeout(async () => {
  try {
    for (let i = 0; i < 150 && !win; i++) await sleep(100)
    await waitFor(() => win.__fastTree && win.__fastTree.ready && win.__fastTreeScene, 30000)
    const scene = win.__fastTreeScene
    const state = win.__fastTree
    await sleep(500)
    const trunkTab = [...doc.querySelectorAll('.tab')].find((t) => (t.textContent || '').includes('树干'))
    trunkTab && trunkTab.click(); await sleep(300)

    line('===== 枝干穿插处理下拉 =====')
    const sel = rowSelect('枝干穿插处理')
    check('存在「枝干穿插处理」下拉', !!sel, sel ? [...sel.options].map((o) => o.value).join(',') : '')
    check('下拉包含挤出式/视觉遮挡/CSG/隐式等档位', !!sel && ['none', 'extrude', 'collar', 'csg', 'implicit'].every((v) =>
      [...sel.options].some((o) => o.value === v)), sel ? [...sel.options].map((o) => o.value).join(',') : '')
    check('默认 = none', state.params.trunk.junctionMode === 'none', String(state.params.trunk.junctionMode))
    const baseTris = state.stats.barkTriangles
    const baseHash = geomHash(scene.barkMesh.geometry)
    const baseBoundary = boundaryEdges(scene.barkMesh.geometry)

    // 挤出式一体建模
    sel.value = 'extrude'; sel.dispatchEvent(new Event('change', { bubbles: true }))
    await waitFor(() => state.params.trunk.junctionMode === 'extrude' && geomHash(scene.barkMesh.geometry) !== baseHash, 30000)
    await sleep(300)
    check('挤出式一体建模生效', state.params.trunk.junctionMode === 'extrude' &&
      geomHash(scene.barkMesh.geometry) !== baseHash, `${baseHash} -> ${geomHash(scene.barkMesh.geometry)}`)
    check('挤出式自动打开一体建模', state.params.trunk.onePiece === true)
    const exPreview = await scene.prepareExport('glb', 'junction-extrude.glb')
    const exJson = parseGLB(await exPreview.payload.blob.arrayBuffer())
    const exNames = (exJson.nodes || []).map((n) => n.name || '')
    check('挤出式导出为单个 Bark + 果实', exNames.includes('Bark') && exNames.includes('Bark_Fruit') &&
      !exNames.some((n) => n === 'Bark_Trunk' || n === 'Bark_Roots' || n.startsWith('Bark_Branch_')), exNames.join(','))

    // 视觉遮挡
    sel.value = 'collar'; sel.dispatchEvent(new Event('change', { bubbles: true }))
    await sleep(1200)
    check('视觉遮挡模式生效', state.params.trunk.junctionMode === 'collar' && geomHash(scene.barkMesh.geometry) !== baseHash,
      `${baseHash} -> ${geomHash(scene.barkMesh.geometry)}`)
    check('视觉遮挡仍保留原始管状几何 (不是并集)', state.stats.barkTriangles === baseTris, `${state.stats.barkTriangles} vs ${baseTris}`)

    // 布尔并集
    sel.value = 'csg'; sel.dispatchEvent(new Event('change', { bubbles: true }))
    await waitFor(() => state.params.trunk.junctionMode === 'csg' && state.stats.barkTriangles !== baseTris, 30000)
    await sleep(400)
    const csgTris = state.stats.barkTriangles
    const csgBoundary = boundaryEdges(scene.barkMesh.geometry)
    const csgHash = geomHash(scene.barkMesh.geometry)
    check('布尔并集模式生效', state.params.trunk.junctionMode === 'csg' && csgTris !== baseTris, `tris ${baseTris} -> ${csgTris}`)
    check('布尔并集自动打开一体建模', state.params.trunk.onePiece === true)
    const csgPreview = await scene.prepareExport('glb', 'junction-csg.glb')
    const csgJson = parseGLB(await csgPreview.payload.blob.arrayBuffer())
    const csgNames = (csgJson.nodes || []).map((n) => n.name || '')
    check('布尔并集导出为单个 Bark + 果实', csgNames.includes('Bark') && csgNames.includes('Bark_Fruit') &&
      !csgNames.some((n) => n === 'Bark_Trunk' || n === 'Bark_Roots' || n.startsWith('Bark_Branch_')), csgNames.join(','))

    // 隐式平滑重建
    sel.value = 'implicit'; sel.dispatchEvent(new Event('change', { bubbles: true }))
    await waitFor(() => state.params.trunk.junctionMode === 'implicit' && geomHash(scene.barkMesh.geometry) !== csgHash, 30000)
    await sleep(400)
    check('隐式重建模式生效且几何不同于 CSG', state.params.trunk.junctionMode === 'implicit' &&
      geomHash(scene.barkMesh.geometry) !== csgHash, `${csgHash} -> ${geomHash(scene.barkMesh.geometry)}`)
    const impPreview = await scene.prepareExport('glb', 'junction-implicit.glb')
    const impJson = parseGLB(await impPreview.payload.blob.arrayBuffer())
    const impNames = (impJson.nodes || []).map((n) => n.name || '')
    check('隐式重建导出为单个 Bark + 果实', impNames.includes('Bark') && impNames.includes('Bark_Fruit') &&
      !impNames.some((n) => n === 'Bark_Trunk' || n === 'Bark_Roots' || n.startsWith('Bark_Branch_')), impNames.join(','))

    // 恢复不处理
    sel.value = 'none'; sel.dispatchEvent(new Event('change', { bubbles: true }))
    await waitFor(() => state.params.trunk.junctionMode === 'none' && state.stats.barkTriangles === baseTris, 30000)
    check('恢复不处理模式', state.params.trunk.junctionMode === 'none' && state.stats.barkTriangles === baseTris,
      `${state.stats.barkTriangles} vs ${baseTris}`)

    line('\n结果: ' + (fail ? 'JUNCTION-FAIL ' + fail : 'JUNCTION-OK'))
    document.title = (fail ? 'JUNCTION-FAIL(' + fail + ')' : 'JUNCTION-OK') + ' :: ' +
      R.filter((s) => s.startsWith('✘')).slice(0, 6).join(' | ')
  } catch (e) {
    document.title = 'JUNCTION-EX :: ' + (e && e.stack ? e.stack : e).toString().slice(0, 900)
    line('EX: ' + (e && e.stack ? e.stack : e))
  }
}, 2200)
</script></body></html>
