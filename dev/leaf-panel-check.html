<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><title>leaf-ui: booting</title></head>
<body style="margin:0;background:#111;color:#ddd;font:12px monospace">
<iframe id="f" src="/" style="width:1200px;height:840px;border:0"></iframe>
<pre id="out">…</pre>
<script type="module">
/* 叶片面板 UI 回归: 截图里出现过的 "孤立 hint 属性被当成正文" 问题
 * 打开「树叶」标签，确认面板里没有源码片段/裸属性文本。 */
const f = document.getElementById('f')
const sleep = (ms) => new Promise((r) => setTimeout(r, ms))
const R = []
let fail = 0
const line = (s) => { R.push(s); document.getElementById('out').textContent = R.join('\n') }
const check = (name, cond, detail = '') => {
  if (!cond) fail++
  line((cond ? '✔ ' : '✘ ') + name + (detail ? ' — ' + detail : ''))
}
async function waitFor(fn, timeout = 20000) {
  const t0 = Date.now()
  while (Date.now() - t0 < timeout) {
    try { if (fn()) return true } catch (e) { /* ignore */ }
    await sleep(100)
  }
  return false
}
let win, doc
f.addEventListener('load', () => { win = f.contentWindow; doc = f.contentDocument })
setTimeout(async () => {
  try {
    for (let i = 0; i < 120 && !win; i++) await sleep(100)
    await waitFor(() => win.__fastTree && win.__fastTree.ready, 30000)
    await sleep(400)

    line('===== 叶片面板 UI =====')
    const tabs = [...doc.querySelectorAll('.tab')]
    const leafTab = tabs.find((t) => (t.textContent || '').includes('树叶'))
    check('存在"树叶"标签页', !!leafTab)
    leafTab.click()
    await sleep(400)

    const panel = doc.body
    // 展开「叶片形态」分组 (默认折叠，v-show 隐藏)
    const secHead = [...doc.querySelectorAll('.section-head')].find((h) => (h.textContent || '').includes('叶片形态'))
    check('存在"叶片形态"分组', !!secHead)
    secHead.click()
    await sleep(300)
    const text = panel.textContent || ''
    check('面板包含"叶片形状"', text.includes('叶片形状'))
    check('面板包含"叶片分段"', text.includes('叶片分段'))
    check('面板没有裸属性文本 (hint= / v-model=)', !/hint\s*=/.test(text) && !/v-model\s*=/.test(text))
    check('面板没有残留的 3D 花冠说明文字', !text.includes('真三维漏斗网格') && !text.includes('双壳有厚度'))
    check('面板没有孤立的自闭合符号 (> 文本)', !/\/>/.test(text))
    const shapeLabel = [...panel.querySelectorAll('.row-head label')].find((l) => (l.textContent || '').includes('叶片形状'))
    check('叶片形状行有下拉框', !!shapeLabel && !!shapeLabel.closest('.row-head')?.querySelector('select'))
    const shapeSelect = shapeLabel && shapeLabel.closest('.row-head')?.querySelector('select')
    check('叶片形状下拉选项 >= 6', !!shapeSelect && shapeSelect.options.length >= 6, 'options=' + (shapeSelect ? shapeSelect.options.length : 0))
    check('叶片形状下拉包含"桦叶 birch"选项', !!shapeSelect && [...shapeSelect.options].some((o) => (o.textContent || '').includes('桦叶')))
    // 段落排序: 叶片形状与叶片分段之间不应该夹着别的东西
    const idxShape = text.indexOf('叶片形状')
    const idxSeg = text.indexOf('叶片分段')
    check('叶片形状与叶片分段相邻 (无杂物)', idxShape >= 0 && idxSeg > idxShape && (idxSeg - idxShape) < 80, `Δ=${idxSeg - idxShape}`)

    line('\n结果: ' + (fail ? 'LEAFUI-FAIL ' + fail : 'LEAFUI-OK'))
    document.title = (fail ? 'LEAFUI-FAIL(' + fail + ')' : 'LEAFUI-OK') + ' :: ' + R.filter((s) => s.startsWith('✘')).join(' | ')
  } catch (e) {
    document.title = 'LEAFUI-EX :: ' + (e && e.stack ? e.stack : e).toString().slice(0, 900)
    line('EX: ' + (e && e.stack ? e.stack : e))
  }
}, 2200)
</script></body></html>
